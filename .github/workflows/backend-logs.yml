name: Backend Logs (debug)

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install modal
      - name: Capture recent app logs
        run: |
          timeout 90 modal app logs talking-avatar > logs.txt 2>&1 || true
          echo "== app logs (${{ '' }}$(wc -l < logs.txt) lines) =="
          cat logs.txt
          echo "== crashed VoiceService container =="
          timeout 60 modal container logs ta-01KX7JQ3HK2MVX931CJ8G3JMBR 2>&1 | tail -120 || true
